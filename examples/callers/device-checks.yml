name: device-checks

# This workflow runs on the pull_request event only, never pull_request_target or workflow_run: it holds the Claude
# token, and fork code must never reach it. The shared workflow refuses any other event.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: device-checks-${{ github.ref }}
  # Only a push replaces a run in progress. A label or a draft toggle must not cancel a running device
  # job, because the run that replaced it would skip and leave the PR with no result.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  device-checks:
    uses: Mobiweb-Studio/ci-workflows/.github/workflows/device-checks.yml@v1
    with:
      reference-vendor: ${{ vars.REFERENCE_VENDOR }}
      # Empty skips maestro-ios. For a self-hosted Mac: '["self-hosted","macOS","ARM64","ios"]'.
      ios-runner: ${{ vars.IOS_RUNNER }}
      jira-evidence: ${{ vars.JIRA_EVIDENCE == 'true' }}
      jira-base-url: ${{ vars.JIRA_BASE_URL }}
      jira-email: ${{ vars.JIRA_EMAIL }}
      jira-project-key: ${{ vars.JIRA_PROJECT_KEY }}
      # To post to each story's sub-task labelled qa instead of the branch's ticket, add:
      # jira-evidence-target: qa-subtask
      # Empty attaches the screenshots to Jira; onedrive stores every run's evidence in a SharePoint or OneDrive
      # library and links the folder in the comment.
      jira-evidence-storage: ${{ vars.JIRA_EVIDENCE_STORAGE }}
      onedrive-drive-id: ${{ vars.MS_DRIVE_ID }}
      onedrive-folder: ${{ github.event.repository.name }}/QA evidence
    # Repository secrets, passed by name. A caller job cannot declare an environment, so an environment's secret
    # never reaches the shared workflow; its jobs still declare the environments (qa-agent, jira-evidence) as approval gates.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      # Optional: the flows' variables, one MAESTRO_<NAME>=<value> per line (test accounts), for the Maestro jobs only.
      MAESTRO_ENV: ${{ secrets.MAESTRO_ENV }}
