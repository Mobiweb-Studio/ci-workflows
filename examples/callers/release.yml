name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    # The release workflow holds store credentials. Pin this ref to an exact tag (v1.2.3) when the project wants
    # a human to review every change to it, and require reviewers on the production-release environment.
    uses: Mobiweb-Studio/ci-workflows/.github/workflows/release.yml@v1
    with:
      enabled: ${{ vars.RELEASE_PLEASE_ENABLED == 'true' }}
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
