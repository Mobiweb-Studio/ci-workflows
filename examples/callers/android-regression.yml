name: android-regression

# Every Maestro flow on an Android emulator, every night on main, so a regression a narrowed PR run missed shows up
# the next morning. The shared workflow refuses any event but schedule and workflow_dispatch: never trigger it from a
# pull request.
on:
  schedule:
    # Every night at 02:17 UTC, when nobody waits on the runners, and off the hour, where GitHub's schedule queue is busiest.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-regression
  cancel-in-progress: false

jobs:
  android-regression:
    uses: Mobiweb-Studio/ci-workflows/.github/workflows/android-regression.yml@v1
    with:
      reference-vendor: ${{ vars.REFERENCE_VENDOR }}
      # The project's app environment to build and test, such as dev, so the flows sign in to its backend with its
      # test users. Empty or absent builds the project's default (prod), as before. Use the same value in every device caller (device-checks, native-cache and the regressions):
      # app-env: dev
      # A client that runs the flows on Expo's cloud emulator (320x640) and its Maestro: test on the same, so a flow
      # that fails there fails here first.
      # android-profile: ""
      # maestro-version: 2.6.1
    # A repository secret, passed by name. Only a project whose .npmrc reads private packages needs it.
    secrets:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      # Optional: the flows' variables, one MAESTRO_<NAME>=<value> per line (test accounts), for the Maestro jobs only.
      MAESTRO_ENV: ${{ secrets.MAESTRO_ENV }}
