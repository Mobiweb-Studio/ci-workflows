name: Build the iOS simulator app
description: >
  Builds the app for the iOS simulator from the commit under test, on a macOS runner with Xcode and CocoaPods
  installed: installs the project's dependencies, generates the iOS project
  for the vendor in APP_VARIANT (set by device-check-env), installs the pods and builds the Release configuration
  for the simulator, unsigned. Needs no secret and no Apple account. Outputs the path of the .app.
outputs:
  app-path:
    description: The built .app, relative to the workspace.
    value: ${{ steps.build.outputs.app-path }}

runs:
  using: composite
  steps:
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Generate the iOS project
      shell: bash
      run: pnpm exec expo prebuild --platform ios --no-install
    - name: Install the pods
      # CocoaPods fails without a UTF-8 locale.
      shell: bash
      working-directory: ios
      env:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
      run: pod install
    - name: Build the Release app for the simulator
      id: build
      shell: bash
      run: |
        workspace=$(ls -d ios/*.xcworkspace | head -1)
        scheme=$(basename "$workspace" .xcworkspace)
        xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO -quiet
        app=$(ls -d build/ios/Build/Products/Release-iphonesimulator/*.app | head -1)
        echo "Built $app"
        echo "app-path=$app" >> "$GITHUB_OUTPUT"
