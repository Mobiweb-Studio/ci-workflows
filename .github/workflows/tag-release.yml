name: tag-release

# Cuts a release of the shared workflows. Started by hand from `main` only. It runs the tests, rewrites the
# internal references to the release's own exact tag, commits that, and tags it. A release candidate
# (1.2.3-rc.1) is tagged and nothing else moves, so a scratch project can rehearse it. A release (1.2.3) also
# moves its floating major (v1) to the new tag, but only when `rehearsal-passed` is true or `skip-rehearsal-reason`
# says why there was none, and never for a candidate. The release tag is annotated, and its message records which.
# Rollback is moving the floating major back to the previous exact tag by hand.
#
# The job runs in the protected environment `release`, whose required reviewers approve every run. The release
# commit changes workflow files, and GitHub does not let the built-in token push that, so the environment holds
# a secret, RELEASE_PUSH_TOKEN: a fine-grained token (or a GitHub App token) for this repository with contents
# write and workflows write. The tag ruleset on `v*` lets only the maintainers and that token's owner create or
# move tags.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version without the v, such as 1.2.3 or 1.2.3-rc.1"
        required: true
      rehearsal-passed:
        description: "A scratch project's CI passed against this release's candidate tag"
        type: boolean
        default: false
      skip-rehearsal-reason:
        description: "Only to release without a rehearsal: why it was skipped. Kept in the tag's message"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tag:
    # Never from another branch: the tagged commit is main plus the one reference rewrite.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "The version must look like 1.2.3 or 1.2.3-rc.1, got: $VERSION" >&2
            exit 1
          fi
      - name: Require the push token
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$RELEASE_PUSH_TOKEN" ]; then
            echo "RELEASE_PUSH_TOKEN is not set in the release environment. The release commit changes workflow files, which the built-in token cannot push." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The push token is not stored in the checkout: install and test run project code, and only the two
          # push steps below see the token.
          persist-credentials: false
      - name: Refuse a version that already has a tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "The tag v$VERSION exists. Tags are immutable: pick the next version." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          # Under RUNNER_TEMP, not the default ~/setup-pnpm: runners that share a Mac user would install over each
          # other's pnpm at the same time.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Point the internal references at this release and tag it
        env:
          VERSION: ${{ inputs.version }}
          REHEARSAL_PASSED: ${{ inputs.rehearsal-passed }}
          SKIP_REHEARSAL_REASON: ${{ inputs.skip-rehearsal-reason }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          node scripts/set-ref.mjs "v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          # The tag's message records how the release was checked: `git tag -l --format='%(contents)' v1.2.3`.
          case "$VERSION" in
            *-rc.*) MESSAGE="Release candidate v$VERSION." ;;
            *)
              if [ "$REHEARSAL_PASSED" = "true" ]; then
                MESSAGE="Release v$VERSION. Rehearsal: passed against its release candidate."
              elif [ -n "$(printf '%s' "$SKIP_REHEARSAL_REASON" | tr -d '[:space:]')" ]; then
                MESSAGE="Release v$VERSION. Rehearsal: skipped. Reason: $SKIP_REHEARSAL_REASON"
              else
                MESSAGE="Release v$VERSION. Rehearsal: not recorded, so the floating major did not move."
              fi
              ;;
          esac
          git tag -a "v$VERSION" -m "$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          git push "https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$VERSION"
      - name: Move the floating major
        env:
          VERSION: ${{ inputs.version }}
          REHEARSAL_PASSED: ${{ inputs.rehearsal-passed }}
          SKIP_REHEARSAL_REASON: ${{ inputs.skip-rehearsal-reason }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          case "$VERSION" in
            *-rc.*) echo "A release candidate does not move the floating major."; exit 0 ;;
          esac
          if [ "$REHEARSAL_PASSED" != "true" ] && [ -z "$(printf '%s' "$SKIP_REHEARSAL_REASON" | tr -d '[:space:]')" ]; then
            echo "The rehearsal was neither recorded as passed nor skipped with a reason: v$VERSION is tagged and the floating major stays where it is."
            exit 0
          fi
          if [ -z "$(git tag -l "v$VERSION-rc.*")" ]; then
            echo "No release candidate v$VERSION-rc.N exists. Tag and rehearse a candidate first: v$VERSION is tagged and the floating major stays where it is."
            exit 0
          fi
          MAJOR="v${VERSION%%.*}"
          # The release tag is annotated, so the floating major names its commit, not the tag object.
          git tag -f "$MAJOR" "v$VERSION^{commit}"
          git push --force "https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$MAJOR"
          echo "$MAJOR now points at v$VERSION."
