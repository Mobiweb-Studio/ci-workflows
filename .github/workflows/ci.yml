name: ci

# The pull request checks of a project: commit messages, secret scan, then types, lint, tests, layout and dead
# code, and the Jira ticket key when the project asks for it. Called from the project's own `ci.yml`, whose job id
# is `ci`, so the checks report as `ci / commits`, `ci / secret-scan`, `ci / checks` and `ci / ticket-key`.
#
# Inputs
#   runner              The runner label for every job. Default: the Blacksmith label the boilerplate uses.
#   require-ticket-key  true to fail a feat/ or fix/ branch whose name or PR title lacks the Jira key. Pass
#                       `${{ vars.REQUIRE_TICKET_KEY == 'true' }}`.
#   jira-project-key    When set, only keys of this Jira project pass. Pass `${{ vars.JIRA_PROJECT_KEY }}`.
#   fsd, dead-code, vendor-isolation
#                       true by default. A project that declined the architecture, dead-code or vendor module
#                       passes false for it, and that step is skipped. A step that is on and whose script is
#                       missing fails, so a removed or misspelled script cannot make a check pass silently.
# Secrets: none.
# Token permissions the caller job must grant: contents: read.
# Files read from the project: .nvmrc, package.json with the scripts typecheck, lint, test, fsd, dead-code and
# vendor-isolation (the last three unless their input is false), a commitlint config, pnpm-lock.yaml, and the
# boilerplate's .setup-pending marker. The workflow assumes pnpm.
# The caller owns the trigger (pull_request: opened, synchronize, reopened, edited) and the concurrency group.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: blacksmith-2vcpu-ubuntu-2404
      require-ticket-key:
        type: boolean
        default: false
      jira-project-key:
        type: string
        default: ""
      fsd:
        type: boolean
        default: true
      dead-code:
        type: boolean
        default: true
      vendor-isolation:
        type: boolean
        default: true

jobs:
  checks:
    # Stage 2: starts after `commits` and `secret-scan`, which share this workflow (ADR 0018). It does not wait
    # for `docs-check`, a separate workflow that reruns on labels: only the device gate waits for that one.
    needs: [commits, secret-scan]
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Require setup in a copy of the template
        env:
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Repository: $REPOSITORY, is_template: $IS_TEMPLATE"
          if [ -f .setup-pending ] && [ "$IS_TEMPLATE" != "true" ]; then
            echo "This copy of the boilerplate is not set up. Run pnpm start-project, commit the result and push."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - if: ${{ inputs.fsd }}
        run: pnpm fsd
      - if: ${{ inputs.dead-code }}
        run: pnpm dead-code
      - if: ${{ inputs.vendor-isolation }}
        run: pnpm vendor-isolation

  commits:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Check the commit messages follow Conventional Commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  secret-scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose .

  ticket-key:
    # Off until the team uses Jira: the caller passes require-ticket-key as true.
    if: ${{ inputs.require-ticket-key }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: Mobiweb-Studio/ci-workflows/actions/ci-scripts@main
      - name: Require a Jira ticket key in the branch name and PR title
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          JIRA_PROJECT_KEY: ${{ inputs.jira-project-key }}
        run: node "$CI_WORKFLOWS_DIR/scripts/ci/ticket-key.mjs" check
