name: native-cache

# Builds the release APK on main, or finds it when the native fingerprint is unchanged, to leave the cached APK
# (keyed by the fingerprint) and the ccache and Gradle caches that pull requests can restore. With `ios-runner`
# set, the `seed-ios` job does the same for the iOS simulator app that device-checks' maestro-ios repacks. GitHub lets a pull
# request read only caches written by its base branch or by itself, so without this job the first run of every
# pull request would build from scratch. Called from the project's own `native-cache.yml`, whose job id is
# `native-cache`.
#
# Inputs
#   runner            The runner label. Default: the Blacksmith label the boilerplate uses.
#   reference-vendor  The vendor folder to build; empty means "default". Pass `${{ vars.REFERENCE_VENDOR }}`.
#   ios-runner        The iOS runner, as in device-checks (a JSON array of labels or one hosted label). Empty, the
#                     default, skips `seed-ios`. Pass the same value as the device-checks caller.
# Secrets
#   NPM_AUTH_TOKEN    Optional. The caller passes it by name from its repository secrets. For a project with private
#                     packages on GitHub Packages, the `seed` and `seed-ios` jobs set it in their environment, and the
#                     device-apk action writes `//npm.pkg.github.com/:_authToken=${NPM_AUTH_TOKEN}` to ~/.npmrc
#                     (device-ios-app to a user-level .npmrc under RUNNER_TEMP) before `pnpm install`. Without it the
#                     variable is empty and nothing changes.
# Token permissions the caller job must grant: contents: read.
# Files read from the project: .nvmrc, package.json, pnpm-lock.yaml, app.config.ts and vendors/<vendor>/vendor.json.
# The caller owns the trigger (push to main with the project's native paths, and workflow_dispatch) and the
# concurrency group.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: blacksmith-2vcpu-ubuntu-2404
      reference-vendor:
        type: string
        default: ""
      ios-runner:
        type: string
        default: ""
    secrets:
      NPM_AUTH_TOKEN:
        required: false

jobs:
  seed:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    # The device-apk action is composite: it cannot read secrets, but its `pnpm install` inherits the job's env.
    env:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: Mobiweb-Studio/ci-workflows/actions/device-apk@v1.13.0
        with:
          reference-vendor: ${{ inputs.reference-vendor }}

  seed-ios:
    # The iOS twin of `seed`. The runner can be a shared self-hosted Mac, so its only secret is the optional npm
    # token, which device-ios-app writes to a user-level .npmrc under RUNNER_TEMP, never to the Mac's own ~/.npmrc.
    if: ${{ inputs.ios-runner != '' }}
    runs-on: ${{ startsWith(inputs.ios-runner, '[') && fromJSON(inputs.ios-runner) || inputs.ios-runner }}
    timeout-minutes: 60
    env:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: Mobiweb-Studio/ci-workflows/actions/device-check-env@v1.13.0
        with:
          reference-vendor: ${{ inputs.reference-vendor }}
          platform: ios
      - uses: Mobiweb-Studio/ci-workflows/actions/device-ios-app@v1.13.0
