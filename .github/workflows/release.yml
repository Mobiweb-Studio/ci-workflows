name: release

# Opens and updates the release PR with release-please, and when a release PR merges, builds that release's tag
# for both stores with EAS and submits it to TestFlight and Google Play internal testing. Promoting to store
# production is manual, in each store console: see docs/ai/first-release.md. The build is in the same workflow
# because a tag created with the default token does not start other workflows. Called from the project's own
# `release.yml`, whose job id is `release`.
#
# Inputs
#   runner         The runner label for every job. Default: the Blacksmith label the boilerplate uses.
#   enabled        true to run. Off until the owner opts in. Pass `${{ vars.RELEASE_PLEASE_ENABLED == 'true' }}`.
#                  See docs/ai/lifecycle.md ("Changelog and releases") before turning it on.
#   config-file, manifest-file
#                  The release-please configuration and manifest. Defaults: release-please-config.json and
#                  .release-please-manifest.json.
# Secrets
#   RELEASE_PLEASE_TOKEN  Optional. A personal access token, so the release PR triggers the required checks.
#                         The caller passes it by name; without it release-please uses the workflow's token.
#   EXPO_TOKEN            The caller passes it by name from its repository secrets. The `release` job also
#                         declares the `production-release` environment, whose required reviewers and branch rules
#                         gate the run: limit it to main and release tags. An environment's own secrets do not
#                         reach a called workflow.
# Token permissions the caller job must grant: contents: write, pull-requests: write.
# Files read from the project: the release-please configuration and manifest, .nvmrc, package.json,
# pnpm-lock.yaml, eas.json and the vendors the production profile builds.
# The caller owns the trigger (push to main) and any concurrency group.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: blacksmith-2vcpu-ubuntu-2404
      enabled:
        type: boolean
        default: false
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: false
      # Passed by the caller from a repository secret.
      EXPO_TOKEN:
        required: false

jobs:
  release-please:
    # Off until the owner opts in: the caller passes enabled as true.
    if: ${{ inputs.enabled }}
    runs-on: ${{ inputs.runner }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # A token from a personal access token lets the release PR trigger the required checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

  # Runs only when the push merged a release PR. Builds that release's tag for both stores and
  # submits it to TestFlight and Google Play internal testing. Promoting to store production is
  # manual, in each store console: see docs/ai/first-release.md. This job is in the same workflow
  # because a tag created with the default token does not start other workflows.
  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    # Holds EXPO_TOKEN. Limit this environment to main and release tags in the repository settings.
    environment: production-release
    concurrency:
      group: release
      cancel-in-progress: false
    # The caller grants write access for release-please; this job only reads the repository.
    permissions:
      contents: read
    steps:
      - name: Require the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set. The caller passes it from a repository secret. See docs/ai/first-release.md." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The token is only set from here on, so the install above never sees it.
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build the production app for both stores
        run: eas build --platform all --profile production --non-interactive --wait --json > builds.json
      - name: Submit to the beta tracks
        # One submit per platform, each waiting for the store to take the upload, so a rejected
        # upload fails this job. The submit profile has no production track.
        run: |
          ANDROID_ID=$(node -p "JSON.parse(require('fs').readFileSync('builds.json','utf8')).find((b) => b.platform === 'ANDROID').id")
          IOS_ID=$(node -p "JSON.parse(require('fs').readFileSync('builds.json','utf8')).find((b) => b.platform === 'IOS').id")
          eas submit --platform android --profile production --id "$ANDROID_ID" --non-interactive --wait
          eas submit --platform ios --profile production --id "$IOS_ID" --non-interactive --wait
