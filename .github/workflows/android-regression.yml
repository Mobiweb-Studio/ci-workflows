name: android-regression

# The Android regression: on main, every Maestro flow, those tagged `nightly` included, on an emulator, with the APK
# device-checks uses (repacked from the cache native-cache seeds on main, or built). The PR checks run only the flows
# a change affects (the project's optional .maestro/IMPACT), so this is what finds a regression a narrowed PR run
# missed. Each flow's report and screenshots are kept as the artifact `android-regression`. Called from the project's
# own regression caller, whose job id is `android-regression`, so the check reports as
# `android-regression / regression`.
#
# Inputs
#   runner            The runner label. The emulator needs KVM and a large disk. Default: the Blacksmith label the
#                     boilerplate uses, as in device-checks.
#   reference-vendor  The vendor folder to test; empty means "default". Pass `${{ vars.REFERENCE_VENDOR }}`.
# Secrets
#   NPM_AUTH_TOKEN    Optional, as in device-checks: the device-apk action's `pnpm install` reads it from the job's env.
#   MAESTRO_ENV       Optional, by name from the caller's repository secrets: the flows' variables, one
#                     MAESTRO_<NAME>=<value> per line, as in device-checks (scripts/ci/maestro-env.sh).
# Token permissions the caller job must grant: contents: read.
# Files read from the project: .nvmrc, package.json, pnpm-lock.yaml, app.config.ts, vendors/<vendor>/vendor.json,
# the flows (.maestro/flows, or the feature folders .maestro/<feature>) and vendors/<vendor>/maestro.
# Runs on the `schedule` and `workflow_dispatch` events only, so the code it runs is a branch of the project's own,
# never a pull request's. Any other event fails the job. The caller owns the trigger and the concurrency group.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: blacksmith-2vcpu-ubuntu-2404
      reference-vendor:
        type: string
        default: ""
    secrets:
      NPM_AUTH_TOKEN:
        required: false
      MAESTRO_ENV:
        required: false

jobs:
  regression:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MAESTRO_VERSION: 2.10.0
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - name: Require a schedule or workflow_dispatch event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "This workflow runs on schedule and workflow_dispatch only, not $EVENT_NAME." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: Mobiweb-Studio/ci-workflows/actions/ci-scripts@v1.13.0
      - name: Put the project's Maestro variables in the environment
        # MAESTRO_ENV holds test accounts and the like (scripts/ci/maestro-env.sh): each value is masked first.
        env:
          MAESTRO_ENV: ${{ secrets.MAESTRO_ENV }}
        run: bash "$CI_WORKFLOWS_DIR/scripts/ci/maestro-env.sh" export
      - id: apk
        uses: Mobiweb-Studio/ci-workflows/actions/device-apk@v1.13.0
        with:
          reference-vendor: ${{ inputs.reference-vendor }}
      - uses: Mobiweb-Studio/ci-workflows/actions/device-check-env@v1.13.0
        with:
          reference-vendor: ${{ inputs.reference-vendor }}
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run every Maestro flow on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.apk-path }}
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$APK_PATH"
            bash "$CI_WORKFLOWS_DIR/scripts/ci/run-maestro.sh"
      - name: Take the Maestro variables out of Maestro's output
        # Its debug output and reports hold the typed text, so the values are replaced before the upload.
        if: always()
        env:
          MAESTRO_ENV: ${{ secrets.MAESTRO_ENV }}
        run: bash "$CI_WORKFLOWS_DIR/scripts/ci/maestro-env.sh" redact maestro-output "$HOME/.maestro/tests" maestro-report-*.xml
      - name: Upload the Maestro reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-regression
          path: |
            maestro-report-*.xml
            maestro-output
          if-no-files-found: warn
          retention-days: 15
          overwrite: true
