name: jira-evidence-merge

# When a PR merges, attaches the screenshots of its last device-check run to the Jira ticket in the branch name
# (ADR 0019), or to its story's QA sub-task when jira-evidence-target is qa-subtask, so the ticket keeps them after
# GitHub deletes the artifacts (15 days). Off until the caller passes jira-evidence as true. Missing evidence and
# every Jira failure are warnings, never a failed job. Called from the project's own `jira-evidence-merge.yml`, whose
# job id is `jira-evidence-merge`.
#
# Inputs
#   runner            The runner label. Default: ubuntu-latest, a GitHub-hosted
#                     runner: the job only reads, waits or comments, so it costs no Blacksmith minutes.
#   jira-evidence     true to post. Pass `${{ vars.JIRA_EVIDENCE == 'true' }}`.
#   jira-base-url, jira-email, jira-project-key
#                     The Jira site, the account's e-mail and the project key. Pass the repository variables
#                     JIRA_BASE_URL, JIRA_EMAIL and JIRA_PROJECT_KEY.
#   jira-evidence-target
#                     Which ticket gets the evidence: `branch-ticket`, the default, is the ticket in the branch name;
#                     `qa-subtask` is the story's sub-task with the label `jira-qa-label` (the branch's ticket is the
#                     story, or its parent when it is a sub-task). With no such sub-task, or more than one, the
#                     evidence goes to the branch's ticket with a warning. People make the QA sub-task; the poster
#                     never creates or edits an issue.
#   jira-qa-label     The label that marks the story's QA sub-task when `jira-evidence-target` is `qa-subtask`.
#                     Default: qa.
#   jira-evidence-storage
#                     Where the evidence files go: `jira`, the default (or empty), attaches the screenshots to the
#                     ticket; `onedrive` uploads the screenshots and qa-report.json of every run to a SharePoint or
#                     OneDrive library with Microsoft Graph, and the comment links the folder with a view-only link
#                     for the organization. Needs the secrets MS_TENANT_ID, MS_CLIENT_ID and MS_CLIENT_SECRET (an
#                     app registration with Sites.Selected, granted write on the one site).
#   onedrive-drive-id The document library's drive id, when `jira-evidence-storage` is `onedrive`.
#   onedrive-folder   The folder in that library that holds the evidence, such as `ICligo/QA evidence`. Under it:
#                     <story>/<ticket>/PR-<n>/<run id>-attempt-<k>/, and PR-<n>/merged/ on merge.
# Secrets: JIRA_API_TOKEN, and MS_TENANT_ID, MS_CLIENT_ID and MS_CLIENT_SECRET when the evidence goes to OneDrive,
# passed by the caller by name from its repository secrets. The job also declares the
# `jira-evidence` environment as a gate, but an environment's own secrets do not reach a called workflow.
# Token permissions the caller job must grant: contents: read, actions: read.
# Files read from the project: .nvmrc.
# Runs only on the `pull_request` event, never `pull_request_target` or `workflow_run`: any other event fails the
# job, so fork code cannot reach the token.
# The caller owns the trigger (pull_request: closed).
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      jira-evidence:
        type: boolean
        default: false
      jira-base-url:
        type: string
        default: ""
      jira-email:
        type: string
        default: ""
      jira-project-key:
        type: string
        default: ""
      jira-evidence-target:
        type: string
        default: branch-ticket
      jira-qa-label:
        type: string
        default: qa
      jira-evidence-storage:
        type: string
        default: jira
      onedrive-drive-id:
        type: string
        default: ""
      onedrive-folder:
        type: string
        default: ""
    secrets:
      JIRA_API_TOKEN:
        required: false
      MS_TENANT_ID:
        required: false
      MS_CLIENT_ID:
        required: false
      MS_CLIENT_SECRET:
        required: false

jobs:
  jira-evidence:
    # Same-repository PRs only, as in device-checks, so forks never see the token.
    if: ${{ github.event.pull_request.merged == true && inputs.jira-evidence && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    environment: jira-evidence
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require a pull_request event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "This workflow runs on the pull_request event only, not $EVENT_NAME: fork code must never reach the Jira token." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: Mobiweb-Studio/ci-workflows/actions/ci-scripts@v1.10.0
      - name: Find the last device-check run with evidence
        id: find
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "run_id=$(node "$CI_WORKFLOWS_DIR/scripts/ci/find-evidence-run.mjs")" >> "$GITHUB_OUTPUT"
      - name: Warn that there is nothing to attach
        if: ${{ steps.find.outputs.run_id == '' }}
        run: |
          echo "::warning::jira-evidence: no device-checks run of this PR still has its artifacts, nothing attached to Jira"
      - name: Download the run's artifacts
        if: ${{ steps.find.outputs.run_id != '' }}
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          # An artifact is missing when its check did not run in that run.
          for name in qa-agent qa-report maestro-android maestro-ios; do
            gh run download "$RUN_ID" -n "$name" -D "evidence/$name" || echo "Run $RUN_ID has no $name artifact"
          done
      - name: Attach the screenshots to the Jira ticket
        if: ${{ steps.find.outputs.run_id != '' }}
        env:
          JIRA_BASE_URL: ${{ inputs.jira-base-url }}
          JIRA_EMAIL: ${{ inputs.jira-email }}
          JIRA_PROJECT_KEY: ${{ inputs.jira-project-key }}
          JIRA_EVIDENCE_TARGET: ${{ inputs.jira-evidence-target }}
          JIRA_QA_LABEL: ${{ inputs.jira-qa-label }}
          # The token is only visible to this step.
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EVIDENCE_STORAGE: ${{ inputs.jira-evidence-storage }}
          MS_DRIVE_ID: ${{ inputs.onedrive-drive-id }}
          ONEDRIVE_FOLDER: ${{ inputs.onedrive-folder }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find.outputs.run_id }}
          EVIDENCE_DIR: evidence
        run: node "$CI_WORKFLOWS_DIR/scripts/ci/jira-evidence.mjs" merge
